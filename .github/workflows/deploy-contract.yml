name: Deploy NEAR contract

# Run by hand: GitHub → Actions → "Deploy NEAR contract" → Run workflow.
# Needs repository secrets NEAR_PRIVATE_KEY (full access key of the contract account)
# and KEEPER_SEED (any long random phrase, also set on the keeper server).
on:
  workflow_dispatch:
    inputs:
      contract:
        description: Contract account
        default: nitroonnear.near
        required: true
      owner:
        description: Owner account that reviews withdrawals (empty = the contract account)
        default: ''
        required: false
      upgrade:
        description: Replace the code of an already deployed contract (only when its storage layout is unchanged)
        type: boolean
        default: false

concurrency: deploy-contract

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo-near
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh \
            || cargo install cargo-near --locked

      - name: Test contract
        working-directory: contract
        run: cargo test

      - name: Build contract
        working-directory: contract
        run: cargo near build non-reproducible-wasm

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install keeper tools
        working-directory: keeper
        run: npm ci

      - name: Deploy
        working-directory: keeper
        env:
          NEAR_PRIVATE_KEY: ${{ secrets.NEAR_PRIVATE_KEY }}
          KEEPER_SEED: ${{ secrets.KEEPER_SEED }}
          CONTRACT_ID: ${{ inputs.contract }}
          OWNER_ID: ${{ inputs.owner }}
          ALLOW_UPGRADE: ${{ inputs.upgrade }}
        run: node deploy.mjs
