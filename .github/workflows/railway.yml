# Deploys to Railway on every push to this branch, so updates never depend on
# Railway's own GitHub auto-deploy.
#
# One-time setup (GitHub repo → Settings → Secrets and variables → Actions):
#   RAILWAY_TOKEN       Railway → your project → Settings → Tokens → create a project token
#   RAILWAY_SERVICE_ID  Railway → your service → Settings → copy the Service ID
name: Deploy to Railway

on:
  push:
    branches: [claude/eager-faraday-ic9ah8]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$SERVICE_ID" ]; then
            echo "Add RAILWAY_TOKEN and RAILWAY_SERVICE_ID in the repo's Actions secrets to enable deploys."
            exit 1
          fi
      - name: Deploy
        run: railway up --service="$SERVICE_ID"
